[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causality-probe"
version = "0.1.0"
description = "Detect look-ahead bias in backtest features by truncation equivalence, with positive controls."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Héctor Sandoval" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.5"]
keywords = ["backtesting", "look-ahead bias", "quantitative finance", "data leakage", "reproducibility"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
causality-probe = "causality_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
